<style>
/* CloudEARTHi MOOC: student website */
:root {
  --ink: #12324f;          /* text, headings */
  --ink-soft: #4d6479;     /* secondary text */
  --blue: #2a78d6;         /* every action and link */
  --blue-deep: #1b5fb0;
  --glacier: #eaf2fb;      /* soft surfaces */
  --page: #f6f9fc;
  --paper: #ffffff;
  --line: #d9e3ee;
  --amber: #e9a23b;        /* achievements only */
  --amber-soft: #fdf3e2;
  --moss: #2e8b67;         /* finished */
  --moss-soft: #e6f4ee;
  --red: #b3372b;
  --red-soft: #fcebe9;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --shadow: 0 1px 2px rgba(18, 50, 79, .06), 0 8px 24px rgba(18, 50, 79, .07);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --w: 1180px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.6 var(--body); }
a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--blue-deep); }
img { max-width: 100%; display: block; }
h1, h2, h3, h4 { font-family: var(--display); color: var(--ink); line-height: 1.12; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(2.1rem, 4.4vw, 3.6rem); font-weight: 700; letter-spacing: -.025em; }
h2 { font-size: clamp(1.45rem, 2.4vw, 1.9rem); font-weight: 650; }
h3 { font-size: 1.2rem; font-weight: 650; }
p { margin: 0 0 1em; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: var(--w); margin: 0 auto; padding: 0 24px; }
.muted { color: var(--ink-soft); }
.small { font-size: .9rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ------------------------------------------------------------------ buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 1rem var(--body);
  padding: 11px 20px; border-radius: 999px; border: 1.5px solid var(--blue); background: var(--blue); color: #fff;
  cursor: pointer; text-decoration: none; transition: background .15s, transform .1s; }
.btn:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--blue); }
.btn.ghost:hover { background: var(--glacier); color: var(--blue-deep); }
.btn.quiet { background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn.quiet:hover { border-color: var(--ink-soft); background: var(--paper); color: var(--ink); }
.btn.big { padding: 14px 26px; font-size: 1.06rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
label.field { display: block; margin-bottom: 14px; font-weight: 600; font-size: .95rem; }
label.field span.hint { display: block; font-weight: 400; color: var(--ink-soft); font-size: .85rem; }
input, textarea, select { width: 100%; font: 1rem var(--body); color: var(--ink); padding: 11px 14px; margin-top: 6px;
  border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--paper); }
input:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(42, 120, 214, .18); }
.msg { padding: 12px 16px; border-radius: var(--r-sm); margin: 0 0 14px; font-size: .95rem; }
.msg.bad { background: var(--red-soft); color: var(--red); }
.msg.good { background: var(--moss-soft); color: var(--moss); }
.msg.note { background: var(--glacier); color: var(--ink); }

/* ------------------------------------------------------------------ header */
.top { position: sticky; top: 0; z-index: 30; background: rgba(255, 255, 255, .92); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 22px; height: 66px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 700 1.12rem var(--display); }
.brand img { width: auto; height: 42px; }
.brand b { color: var(--blue); font-weight: 700; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--ink-soft); font-weight: 600; padding: 8px 12px; border-radius: 999px; }
.nav a:hover { color: var(--ink); background: var(--glacier); }
.nav a.on { color: var(--blue); background: var(--glacier); }
.account { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center;
  font: 700 .95rem var(--display); border: 0; cursor: pointer; }
.menu { position: relative; }
.menu-panel { position: absolute; right: 0; top: 48px; background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-md); box-shadow: var(--shadow); min-width: 230px; padding: 8px; }
.menu-panel .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu-panel a, .menu-panel button { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--r-sm);
  background: none; border: 0; font: 1rem var(--body); color: var(--ink); text-decoration: none; cursor: pointer; }
.menu-panel a:hover, .menu-panel button:hover { background: var(--glacier); }

/* ------------------------------------------------------------------ hero (the one bold element) */
.hero { position: relative; overflow: hidden; background: linear-gradient(180deg, #fff 0%, var(--glacier) 100%);
  border-bottom: 1px solid var(--line); }
.hero svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .map .c { fill: none; stroke: #9fc1e8; stroke-width: 1.1; opacity: .55; }
.hero .map .c.k { stroke: #6fa3df; stroke-width: 1.4; opacity: .7; }
.hero .map .route { fill: none; stroke: var(--blue); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 2 11; }
.hero .map .route-draw { fill: none; stroke: var(--page); stroke-width: 7; stroke-linecap: round; }
.hero .map .pin { fill: var(--paper); stroke: var(--blue); stroke-width: 3; }
.hero .map .summit { fill: var(--amber); }
.hero .wrap { position: relative; padding-top: 86px; padding-bottom: 92px; }
.hero h1 { max-width: 15ch; }
.hero .lead { font-size: 1.2rem; color: var(--ink-soft); max-width: 46ch; margin: 18px 0 28px; }
.search { display: flex; max-width: 560px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 5px 5px 5px 20px; box-shadow: var(--shadow); align-items: center; }
.search svg { width: 20px; height: 20px; flex: none; color: var(--ink-soft); }
.search input { border: 0; margin: 0; box-shadow: none !important; padding: 10px 12px; background: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .hero .map .route-draw { animation: draw 2.6s .3s cubic-bezier(.6, .1, .3, 1) forwards; }
  .hero .map .summit-g { opacity: 0; animation: pop .5s 2.7s forwards; }
}
@keyframes draw { to { stroke-dashoffset: var(--len); } }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ home sections */
.section { padding: 56px 0 8px; }
.continue { margin-top: -44px; position: relative; z-index: 2; }
.continue .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 20px 24px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.continue .panel .t { flex: 1 1 260px; }
.project-head { display: grid; grid-template-columns: 84px 1fr auto; gap: 22px; align-items: start; margin-bottom: 26px; }
.project-head .logo { width: 84px; height: 84px; border-radius: var(--r-md); background: var(--paper); border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden; padding: 8px; }
.project-head .logo img { max-height: 100%; object-fit: contain; }
.project-head p { margin: 8px 0 0; color: var(--ink-soft); max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; text-decoration: none;
  color: var(--ink); display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: #b7cbe0; box-shadow: var(--shadow); color: var(--ink); }
.card .cover { aspect-ratio: 16 / 9; background: var(--glacier); position: relative; overflow: hidden; }
.card .cover img, .card .cover svg { width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card .body h3 { font-size: 1.22rem; }
.card .sum { color: var(--ink-soft); font-size: .97rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.fact { font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--glacier); color: var(--ink); }
.fact.done { background: var(--moss-soft); color: var(--moss); }
.fact.prize { background: var(--amber-soft); color: #8a5a10; }
.bar { height: 8px; border-radius: 99px; background: #e1e9f2; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.bar.done i { background: var(--moss); }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r-lg); padding: 34px; text-align: center; color: var(--ink-soft); background: var(--paper); }

/* ------------------------------------------------------------------ course page */
.course-hero { background: var(--paper); border-bottom: 1px solid var(--line); }
.course-hero .wrap { padding-top: 36px; padding-bottom: 36px; }
.crumbs { font-size: .92rem; margin-bottom: 14px; color: var(--ink-soft); }
.crumbs a { color: var(--ink-soft); }
.course-hero h1 { font-size: clamp(1.9rem, 3.6vw, 2.8rem); max-width: 22ch; }
.course-hero .lead { font-size: 1.15rem; color: var(--ink-soft); max-width: 60ch; margin: 12px 0 16px; }
.course-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; padding: 36px 0 70px; align-items: start; }
.side { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 16px; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; }
.box h3 { margin-bottom: 10px; }
.side .cover { border-radius: var(--r-md); overflow: hidden; aspect-ratio: 16 / 9; margin: -6px -6px 16px; }
.side .cover img, .side .cover svg { width: 100%; height: 100%; object-fit: cover; }
.outcomes { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.outcomes li { display: flex; gap: 12px; align-items: flex-start; }
.outcomes li svg { flex: none; width: 22px; height: 22px; margin-top: 2px; color: var(--moss); }
.prize-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.prize-row:first-of-type { border-top: 0; }
.prize-row .seal { width: 48px; height: 48px; border-radius: 50%; flex: none; background: var(--amber-soft); display: grid; place-items: center;
  overflow: hidden; border: 2px solid var(--amber); font-size: 1.3rem; }
.prize-row .seal img { width: 100%; height: 100%; object-fit: cover; }

/* the course route (syllabus) */
.route { position: relative; margin: 8px 0 0; padding-left: 0; list-style: none; }
.stage { position: relative; padding: 0 0 26px 46px; }
.stage::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 0; border-left: 2.5px dashed #b9cde3; }
.stage:last-child::before { display: none; }
.stage .marker { position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--paper);
  border: 2.5px solid var(--blue); display: grid; place-items: center; font: 700 .85rem var(--display); color: var(--blue); }
.stage.done .marker { background: var(--moss); border-color: var(--moss); color: #fff; }
.stage h3 { font-size: 1.15rem; padding-top: 3px; }
.stage .about { color: var(--ink-soft); margin: 4px 0 8px; font-size: .97rem; }
.steps { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
.steps li { display: flex; gap: 10px; align-items: center; font-size: .96rem; padding: 6px 10px; border-radius: var(--r-sm); }
.steps li .kind { color: var(--ink-soft); font-size: .85rem; margin-left: auto; }
.steps li .ic { width: 20px; height: 20px; flex: none; color: var(--ink-soft); }
.steps li.done .ic { color: var(--moss); }
.steps a { color: var(--ink); text-decoration: none; display: contents; }
.steps li.link:hover { background: var(--glacier); cursor: pointer; }

/* ------------------------------------------------------------------ learning view */
.learn { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100vh - 66px); }
.rail { background: var(--paper); border-right: 1px solid var(--line); padding: 22px 18px 40px; position: sticky; top: 66px;
  height: calc(100vh - 66px); overflow: auto; }
.rail .ctitle { font: 650 1.08rem var(--display); color: var(--ink); text-decoration: none; display: block; margin-bottom: 10px; }
.rail .lec { margin-top: 20px; }
.rail .lec-t { font: 650 .98rem var(--display); margin-bottom: 6px; }
.way { list-style: none; margin: 0; padding: 0; }
.way li { position: relative; padding-left: 30px; }
.way li::before { content: ""; position: absolute; left: 8px; top: 26px; bottom: -6px; border-left: 2px dashed #c5d6e8; }
.way li:last-child::before { display: none; }
.way .dot { position: absolute; left: 1px; top: 11px; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #9db6cf; background: var(--paper); }
.way li.done .dot { background: var(--moss); border-color: var(--moss); }
.way li.on .dot { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(42, 120, 214, .18); }
.way button { all: unset; display: block; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; font-size: .95rem; width: 100%; box-sizing: border-box; }
.way button:hover { background: var(--glacier); }
.way button:focus-visible { outline: 3px solid var(--blue); }
.way li.on button { background: var(--glacier); font-weight: 700; }
.way .k { display: block; font-size: .8rem; color: var(--ink-soft); font-weight: 400; }
.redo { margin-top: 8px; font-size: .88rem; }
.redo button { all: unset; color: var(--blue); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.redo button:disabled { color: var(--ink-soft); cursor: default; text-decoration: none; }
.stage-main { padding: 30px clamp(18px, 4vw, 56px) 60px; max-width: 1000px; width: 100%; }
.stage-main .where { color: var(--ink-soft); font-size: .95rem; margin-bottom: 4px; }
.stage-main h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); margin-bottom: 18px; }
.player { position: relative; aspect-ratio: 16 / 9; background: #0d2236; border-radius: var(--r-lg); overflow: hidden; }
.player > div, .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.ask { position: absolute; inset: 0; background: rgba(13, 34, 54, .78); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 4; }
.ask.show { display: flex; }
.qcard { background: var(--paper); border-radius: var(--r-lg); padding: 22px 24px; max-width: 580px; width: 100%; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
.qcard .q { font: 650 1.15rem var(--display); margin-bottom: 12px; }
.opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--paper); font: 1rem var(--body); color: var(--ink); cursor: pointer; }
.opt:hover { border-color: var(--blue); }
.opt.sel { border-color: var(--blue); background: var(--glacier); }
.opt.right { border-color: var(--moss); background: var(--moss-soft); }
.opt:disabled { cursor: default; }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: var(--r-sm); display: none; }
.feedback.ok { display: block; background: var(--moss-soft); color: var(--moss); }
.feedback.bad { display: block; background: var(--red-soft); color: var(--red); }
.pdf { width: 100%; height: 76vh; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper); }
.reading { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px 32px; max-width: 72ch; font-size: 1.05rem; line-height: 1.7; }
.qlist { display: grid; gap: 14px; margin-top: 18px; }
.qlist .box { padding: 20px 22px; }
.status-line { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }
.status-line .grow { flex: 1; }
.stepnav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--line); }
.done-chip { display: inline-flex; gap: 6px; align-items: center; background: var(--moss-soft); color: var(--moss); padding: 4px 12px; border-radius: 99px; font-size: .9rem; font-weight: 700; }

/* ------------------------------------------------------------------ sign in / account */
.auth { max-width: 460px; margin: 56px auto 80px; }
.auth .box { padding: 32px; }
.auth h1 { font-size: 2rem; margin-bottom: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ------------------------------------------------------------------ my learning */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.medal { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 14px; text-align: center; text-decoration: none; color: var(--ink); }
.medal:hover { border-color: var(--amber); color: var(--ink); }
.medal .seal { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 10px; border: 3px solid var(--amber); background: var(--amber-soft);
  display: grid; place-items: center; overflow: hidden; font-size: 2rem; }
.medal .seal img { width: 100%; height: 100%; object-fit: cover; }
.medal b { display: block; font-family: var(--display); line-height: 1.25; }

/* award moment */
.celebrate { position: fixed; inset: 0; background: rgba(13, 34, 54, .62); z-index: 60; display: grid; place-items: center; padding: 18px; }
.celebrate .box { max-width: 420px; text-align: center; padding: 34px 30px; }
.celebrate .seal { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 16px; border: 4px solid var(--amber); background: var(--amber-soft);
  display: grid; place-items: center; overflow: hidden; font-size: 3rem; }
.celebrate .seal img { width: 100%; height: 100%; object-fit: cover; }
@media (prefers-reduced-motion: no-preference) { .celebrate .seal { animation: pop .45s ease-out; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px;
  border-radius: 999px; z-index: 70; font-weight: 600; box-shadow: var(--shadow); }

/* ------------------------------------------------------------------ footer */
.foot { border-top: 1px solid var(--line); background: var(--paper); padding: 30px 0; color: var(--ink-soft); font-size: .92rem; }
.foot .wrap { display: flex; gap: 20px; flex-wrap: wrap; justify-content: space-between; }
.loading { padding: 80px 0; text-align: center; color: var(--ink-soft); }

/* ------------------------------------------------------------------ small screens */
@media (max-width: 920px) {
  .course-layout { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .learn { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .wrap { padding: 0 16px; }
  .nav { display: none; }
  .top .wrap { gap: 12px; }
  .hero .wrap { padding-top: 54px; padding-bottom: 70px; }
  .project-head { grid-template-columns: 60px 1fr; }
  .project-head .logo { width: 60px; height: 60px; }
  .project-head .site { grid-column: 1 / -1; }
  .two { grid-template-columns: 1fr; }
  .reading { padding: 20px; }
  .account .btn.ghost { display: none; }
}

</style>

/* CloudEARTHi MOOC: student website.
   Reads and writes the MOOC database through its mooc_* functions with the publishable key; every call that concerns
   a student carries their Octa session token, and the database checks it. Right answers never reach the browser. */
"use strict";

const CFG = {
  db: "https://uxqeukvmnfvpgsxktgvo.supabase.co",
  key: "sb_publishable_oFEaDte2Hy-gGsqpa9kWeQ_HuMm6dou",   // publishable key: meant for web pages
  studio: "https://cloudearthi-mooc.streamlit.app/",
  app: "octa_mooc",
};
const TOKEN_KEY = "cloudearthi_mooc_session";

// ------------------------------------------------------------------------------------------------ small helpers
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const fullName = u => [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || "";
const initials = u => (fullName(u).split(/\s+/).map(w => w[0]).join("").slice(0, 2) || "?").toUpperCase();
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
};

async function api(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${CFG.db}/rest/v1/rpc/${fn}`, {
      method: "POST", body: JSON.stringify(args),
      headers: { apikey: CFG.key, Authorization: `Bearer ${CFG.key}`, "Content-Type": "application/json" },
    });
  } catch (e) { throw new Error("The MOOC cannot be reached. Check your internet connection and try again."); }
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { /* not JSON */ }
  if (!r.ok) throw new Error((data && data.message) || `The MOOC answered with an error (${r.status}).`);
  return data;
}

function toast(text, ms = 3200) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// ------------------------------------------------------------------------------------------------ contour artwork
// Deterministic "map" drawings: concentric wobbly rings around a few peaks. Used for the hero and for course covers.
function rng(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function ring(cx, cy, r, wob, phase) {
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    const k = 1 + wob * (Math.sin(3 * a + phase) * .55 + Math.sin(5 * a + phase * 1.7) * .3 + Math.sin(2 * a - phase) * .25);
    pts.push([cx + Math.cos(a) * r * k * 1.25, cy + Math.sin(a) * r * k * .85]);
  }
  return "M" + pts.map(p => p.map(n => n.toFixed(1)).join(",")).join("L") + "Z";
}
function contours(w, h, seed, peaks, rings) {
  const rand = rng(seed); let out = "";
  for (let p = 0; p < peaks.length; p++) {
    const [px, py, size] = peaks[p];
    const phase = rand() * 6;
    for (let i = 1; i <= rings; i++) {
      const r = (size / rings) * i;
      out += `<path class="c${i % 4 === 0 ? " k" : ""}" d="${ring(px * w, py * h, r, .08 + i * .012, phase + i * .07)}"/>`;
    }
  }
  return out;
}
const COVER_TONES = [["#e4effb", "#2a78d6", "#9fc1e8"], ["#e6f4ee", "#2e8b67", "#9fd0bb"], ["#fdf3e2", "#c98419", "#f1cf94"], ["#efeaf9", "#6a54c4", "#c3b6ec"]];
function coverArt(seed) {
  const rand = rng(seed); const [bg, strong, soft] = COVER_TONES[Math.floor(rand() * COVER_TONES.length)];
  const peaks = [[.25 + rand() * .2, .35 + rand() * .3, 120], [.7 + rand() * .2, .55 + rand() * .3, 95]];
  const paths = contours(400, 225, seed, peaks, 9).replace(/class="c k"/g, `stroke="${strong}" stroke-width="1.6" fill="none"`)
    .replace(/class="c"/g, `stroke="${soft}" stroke-width="1.2" fill="none"`);
  return `<svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="225" fill="${bg}"/>${paths}
    <circle cx="${(peaks[0][0] * 400).toFixed(0)}" cy="${(peaks[0][1] * 225).toFixed(0)}" r="6" fill="${strong}"/></svg>`;
}
function cover(c) { return c.image_url ? `<img src="${esc(c.image_url)}" alt="" loading="lazy">` : coverArt(c.slug || c.id); }

let cleanup = null;
function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";

}
async function route() {
  if (cleanup) { cleanup(); cleanup = null; }

  $$(".rail [data-redo]").forEach(b => (b.onclick = async () => {
    const l = VIEW.lectures.find(x => x.id === b.dataset.redo);
    if (!confirm(`Redo "${l.title}"? Your answers there start again, so you see every question again. Your best score is kept, and badges you earned stay yours.`)) return;
    const r = await api("mooc_retake", { p_token: S.token, p_lecture: l.id, p_course: null });
    if (!r.ok) return toast(r.error, 5000);
    S.mine = null; await loadCourse(slug); toast("Ready for a new try. Start again from the first step.");
    location.hash = `#/learn/${encodeURIComponent(slug)}/${l.steps[0].id}`;
  }));
}
async function refreshAfter(slug, step, goNext) {
  await loadCourse(slug);
  const steps = allSteps(), i = steps.findIndex(s => s.id === step.id);
  if (goNext && i >= 0 && i < steps.length - 1) location.hash = `#/learn/${encodeURIComponent(slug)}/${steps[i + 1].id}`;
  else { drawRail(slug, step.id); openStep(slug, stepById(step.id)); }
}
async function complete(slug, step) {
  const r = await record(step, "completed");
  if (!r.ok) return toast(r.error || "This step could not be saved.", 5000);
  toast("Step completed");
  refreshAfter(slug, step, true);
}
function stepNav(slug, step) {
  const steps = allSteps(), i = steps.findIndex(s => s.id === step.id);
  const prev = steps[i - 1], next = steps[i + 1];
  return `<nav class="stepnav" aria-label="Steps">
    ${prev ? `<a class="btn quiet" href="#/learn/${encodeURIComponent(slug)}/${prev.id}">Previous step</a>` : "<span></span>"}
    ${next ? `<a class="btn ghost" href="#/learn/${encodeURIComponent(slug)}/${next.id}">Next step</a>`
           : `<a class="btn ghost" href="#/course/${encodeURIComponent(slug)}">Back to the course page</a>`}</nav>`;
}
function openStep(slug, step) {
  stopPlayer();
  const box = $("#stage"), cfg = step.config || {}, done = isDone(step);
  const head = `<div class="where">${esc(step.lecture.title)}</div><h1>${esc(step.title)} ${done ? `<span class="done-chip">${ICON.check.replace('<svg', '<svg width="16" height="16"')} Done</span>` : ""}</h1>`;
  record(step, "opened").catch(() => null);
  const render = { video: stepVideo, pdf: stepPdf, text: stepText, quiz: stepQuiz, assignment: stepAssignment, live: stepLive }[step.kind];
  box.innerHTML = head + `<div id="content"></div>` + stepNav(slug, step);
  if (render) render($("#content"), slug, step, cfg);
  $("#stage").focus?.();
}

// one question: on a video, a PDF or in a quiz
function question(el, q, onRight, where = "") {
  const multi = q.kind === "multiple", chosen = new Set();
  el.innerHTML = `${where ? `<div class="small muted">${esc(where)}</div>` : ""}<div class="q">${esc(q.prompt)}</div>
    ${multi ? `<div class="small muted" style="margin:-6px 0 6px">Choose all answers that apply.</div>` : ""}
    ${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}
    ${multi ? `<button class="btn" data-check style="margin-top:6px">Check my answer</button>` : ""}<div class="feedback" aria-live="polite"></div>`;
  const fb = $(".feedback", el);
  const send = async () => {
    const r = await api("mooc_answer", { p_token: S.token, p_question: q.id, p_answer: [...chosen] });
    if (!r.ok) { fb.className = "feedback bad"; fb.textContent = r.error; return; }
    celebrate(r.awarded);
    if (r.correct) {
      fb.className = "feedback ok"; fb.textContent = "Right. " + (r.explanation || "");
      $$(".opt", el).forEach(b => { b.disabled = true; if (chosen.has(b.dataset.i)) b.classList.add("right"); });
      const c = $("[data-check]", el); if (c) c.disabled = true;
      setTimeout(() => onRight(r), 900);
    } else if (q.must_pass) {
      fb.className = "feedback bad"; fb.textContent = "Not quite. Have another look and try again.";
      chosen.clear(); $$(".opt", el).forEach(b => b.classList.remove("sel"));
    } else {
      const right = (r.correct_answer || []).map(i => q.options[+i]).join(", ");
      fb.className = "feedback bad"; fb.textContent = `Not quite. The answer is: ${right}. ${r.explanation || ""}`;
      setTimeout(() => onRight(r), 2600);
    }
  };
  $$(".opt", el).forEach(b => (b.onclick = () => {
    const i = b.dataset.i;
    if (multi) { chosen.has(i) ? chosen.delete(i) : chosen.add(i); b.classList.toggle("sel"); }
    else { chosen.clear(); chosen.add(i); b.classList.add("sel"); send(); }
  }));
  const c = $("[data-check]", el); if (c) c.onclick = () => chosen.size && send();
}

function stepVideo(el, slug, step, cfg) {
  const qs = (step.questions || []).filter(q => q.at_seconds != null);
  const answered = new Set();                 // every viewing asks every question again
  el.innerHTML = `<div class="player"><div id="yt"></div><div class="ask" id="ask"><div class="qcard" id="qcard"></div></div></div>
    <div class="status-line"><span class="grow muted" id="vstat">Press play to start.</span>
      <button class="btn" id="vdone" disabled>I have watched it</button></div>
    ${qs.length ? `<p class="small muted" style="margin-top:8px">${plural(qs.length, "question")} will pause this video. Answer to continue watching.</p>` : ""}`;
  if (!cfg.youtube_id) { $("#vstat").textContent = "The teacher has not added the video yet."; return; }
  let maxPos = 0, lastSent = 0, duration = 0, asking = null;
  const start = cfg.start || 0, end = () => cfg.end || duration;
  const canFinish = () => isDone(step) || (qs.every(q => !q.must_pass || answered.has(q.id)) && duration && maxPos >= start + .9 * (end() - start));
  const update = () => {
    $("#vdone").disabled = !canFinish();
    if (duration) $("#vstat").textContent = isDone(step) ? "You have finished this video. Watch it again any time." : `Watched up to ${mmss(maxPos)} of ${mmss(end())}`;
  };
  $("#vdone").onclick = () => complete(slug, step);
  withYouTube(() => {
    if (!$("#yt")) return;
    player = new YT.Player("yt", {
      videoId: cfg.youtube_id,
      playerVars: { start, end: cfg.end || undefined, rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: () => {
          duration = player.getDuration(); update();
          poll = setInterval(() => {
            if (!player || !player.getCurrentTime || asking) return;
            const t = player.getCurrentTime();
            const q = qs.find(x => !answered.has(x.id) && t >= x.at_seconds);
            if (q) {
              if (t > q.at_seconds + 2) player.seekTo(q.at_seconds, true);   // skipped ahead: go back to the question
              player.pauseVideo(); asking = q;
              if (document.fullscreenElement) document.exitFullscreen().catch(() => null);
              $("#ask").classList.add("show");
              question($("#qcard"), q, () => { answered.add(q.id); asking = null; $("#ask").classList.remove("show"); update(); player.playVideo(); },
                       `Question at ${mmss(q.at_seconds)}`);
              return;
            }
            if (t <= maxPos + 3 && t > maxPos) maxPos = t;               // jumping forward does not count as watching
            if (maxPos - lastSent >= 15) { lastSent = maxPos; record(step, "progressed", Math.round(maxPos)).catch(() => null); }
            update();
          }, 500);
        },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED) {
            maxPos = Math.max(maxPos, end()); update();
            record(step, "progressed", Math.round(maxPos)).catch(() => null);
            if (canFinish() && !isDone(step)) complete(slug, step);
          }
        },
        onError: e => { $("#vstat").textContent = `YouTube cannot play this video (error ${e.data}). Tell your teacher.`; },
      },
    });
  });
}
function stepPdf(el, slug, step, cfg) {
  const qs = step.questions || [], answered = new Set();
  el.innerHTML = cfg.url ? `<iframe class="pdf" src="${esc(cfg.url)}#view=FitH" title="${esc(step.title)}"></iframe>
      <p class="small" style="margin-top:8px"><a href="${esc(cfg.url)}" target="_blank" rel="noopener">Open the PDF in a new tab</a></p>`
    : `<div class="empty">The teacher has not uploaded this reading yet.</div>`;
  el.insertAdjacentHTML("beforeend", `<div id="pq"></div><div class="status-line"><span class="grow"></span><button class="btn" id="pdone">I have read it</button></div>`);
  const draw = () => {
    const pq = $("#pq");
    pq.innerHTML = qs.length ? `<h2 style="margin-top:22px;font-size:1.3rem">Questions on this reading</h2><div class="qlist"></div>` : "";
    qs.forEach(q => {
      const d = document.createElement("div"); d.className = "box";
      if (answered.has(q.id)) d.innerHTML = `<span class="done-chip">Answered</span> <span style="margin-left:8px">${esc(q.prompt)}</span>`;
      else question(d, q, () => { answered.add(q.id); draw(); }, q.at_page ? `Page ${q.at_page}` : "");
      $(".qlist", pq).appendChild(d);
    });
    const left = qs.filter(q => q.must_pass && !answered.has(q.id)).length;
    $("#pdone").disabled = left > 0 && !isDone(step);
    $("#pdone").title = left ? "Answer the questions first" : "";
  };
  draw();
  $("#pdone").onclick = () => complete(slug, step);
  record(step, "progressed", 1).catch(() => null);
}
function markdown(md) {
  return esc(md).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .split(/\n\s*\n/).map(p => /^- /m.test(p) ? `<ul>${p.split(/\n/).map(x => `<li>${x.replace(/^- /, "")}</li>`).join("")}</ul>` : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}
function stepText(el, slug, step, cfg) {
  el.innerHTML = `<div class="reading">${markdown(cfg.markdown || "") || `<p class="muted">The teacher has not written this reading yet.</p>`}</div>
    <div class="status-line"><span class="grow"></span><button class="btn" id="tdone">I have read it</button></div>`;
  $("#tdone").onclick = () => complete(slug, step);
}
function stepQuiz(el, slug, step) {
  const qs = step.questions || [], answered = new Set();
  const best = step.progress && step.progress.score != null ? `<span class="done-chip">Your score: ${Math.round(step.progress.score)}%</span>` : "";
  el.innerHTML = (qs.length ? `<p class="muted">${plural(qs.length, "question")}. Your score counts the answers that are right on the first try. ${best}</p>` : "")
    + `<div class="qlist" id="qq"></div>`;
  if (!qs.length) { $("#qq").innerHTML = `<div class="empty">The teacher has not added questions yet.</div>`; return; }
  const draw = () => {
    const qq = $("#qq"); qq.innerHTML = "";
    qs.forEach((q, i) => {
      const d = document.createElement("div"); d.className = "box";
      if (answered.has(q.id)) d.innerHTML = `<span class="done-chip">Answered</span> <span style="margin-left:8px">${i + 1}. ${esc(q.prompt)}</span>`;
      else question(d, q, () => {
        answered.add(q.id);
        if (answered.size === qs.length) { toast("Quiz completed"); refreshAfter(slug, step, true); } else draw();
      }, `Question ${i + 1} of ${qs.length}`);
      qq.appendChild(d);
    });
  };
  draw();
}
function stepAssignment(el, slug, step, cfg) {
  const sub = step.submission;
  el.innerHTML = `<div class="reading">${markdown(cfg.instructions || "") || `<p class="muted">The teacher has not written the instructions yet.</p>`}</div>
    ${sub ? `<div class="msg ${sub.score != null ? "good" : "note"}" style="margin-top:16px">You handed this in on ${esc(new Date(sub.submitted_at).toLocaleDateString("en-GB", { day: "numeric", month: "long" }))}.
       ${sub.score != null ? `Your grade: <b>${Math.round(sub.score)}</b>. ${esc(sub.feedback || "")}` : "Your teacher will grade it."}</div>` : ""}
    <label class="field" style="margin-top:16px">Your answer<textarea id="ans" rows="8" placeholder="Write your answer here"></textarea></label>
    <div class="status-line"><span class="grow small muted">${cfg.grading === "auto" ? "Handing it in completes this step." : "A teacher grades your answer from 0 to 100."}</span>
      <button class="btn" id="send">${sub ? "Hand in again" : "Hand in"}</button></div>`;
  $("#send").onclick = async () => {
    const text = $("#ans").value.trim();
    if (!text) return toast("Write your answer first.");
    $("#send").disabled = true;
    const r = await api("mooc_submit", { p_token: S.token, p_step: step.id, p_answer: text, p_file_url: null });
    if (!r.ok) { $("#send").disabled = false; return toast(r.error, 5000); }
    celebrate(r.awarded); toast("Handed in");
    refreshAfter(slug, step, cfg.grading === "auto");
  };
}
function stepLive(el, slug, step, cfg) {
  el.innerHTML = `<div class="box"><h3>${cfg.group ? "Study group" : "Online lecture"}</h3>
      <p class="muted" style="margin:6px 0 16px">${[cfg.starts_at, cfg.minutes && `${cfg.minutes} minutes`].filter(Boolean).map(esc).join(", ") || "The teacher will share the time."}</p>
      ${cfg.room ? `<button class="btn" id="join">Join the session</button>` : `<p class="muted">The teacher has not added the meeting link yet.</p>`}</div>`;
  const j = $("#join");
  if (j) j.onclick = async () => {
    window.open(cfg.room, "_blank", "noopener");
    const r = await record(step, "joined_live");
    if (r.ok) refreshAfter(slug, step, true);
  };
}

// ------------------------------------------------------------------------------------------------ my learning
async function viewMy(view) {
  if (!S.me) return needSignIn("/my");
  const m = await myLearning(true);
  if (!m) return needSignIn("/my");
  const courses = m.courses.map(c => {
    const pct = c.steps ? Math.round(100 * c.done / c.steps) : 0;
    return `<div class="card"><a class="cover" href="#/course/${encodeURIComponent(c.slug)}" tabindex="-1">${cover(c)}</a>
      <div class="body"><h3>${esc(c.title)}</h3>${c.project ? `<div class="muted small">${esc(c.project)}</div>` : ""}
        <div class="bar ${pct === 100 ? "done" : ""}" style="margin-top:6px"><i style="width:${pct}%"></i></div>
        <div class="small muted">${c.done} of ${c.steps} steps done</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <a class="btn" href="#/learn/${encodeURIComponent(c.slug)}${c.next_step ? "/" + c.next_step : ""}">${c.next_step ? (c.done ? "Continue" : "Start") : "Review"}</a>
          ${c.certificate ? `<a class="btn quiet" href="https://octainsight.github.io/mooc/award.html?id=${c.certificate}" target="_blank" rel="noopener">Your certificate</a>` : ""}</div></div></div>`;
  }).join("");
  const awards = m.awards.map(a => `<a class="medal" href="https://octainsight.github.io/mooc/award.html?id=${a.id}" target="_blank" rel="noopener">
      <div class="seal">${a.image_url ? `<img src="${esc(a.image_url)}" alt="">` : (a.kind === "certificate" ? "📜" : "🏅")}</div>
      <b>${esc(a.title)}</b><span class="small muted">${a.kind === "certificate" ? "Certificate" : "Badge"}, ${esc(new Date(a.issued_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }))}</span></a>`).join("");
  view.innerHTML = `<div class="wrap" style="padding:44px 24px 80px">
      <h1 style="font-size:clamp(1.9rem,3.6vw,2.6rem)">Hello, ${esc(S.me.first_name || S.me.username)}</h1>
      <p class="muted" style="margin:8px 0 0">Your courses, your progress and what you have earned.
        <a href="https://octainsight.github.io/mooc/profile.html?u=${encodeURIComponent(S.me.username)}" target="_blank" rel="noopener">See your public profile</a></p>
      <h2 style="margin:36px 0 16px">My courses</h2>
      ${courses ? `<div class="grid">${courses}</div>` : `<div class="empty">You have not started a course yet. <a href="#/">Choose a course</a> and start straight away.</div>`}
      <h2 style="margin:44px 0 16px">Badges and certificates</h2>
      ${awards ? `<div class="shelf">${awards}</div>` : `<div class="empty">Finish lectures to earn badges, and a whole course to earn its certificate.</div>`}
    </div>`;
}

// ------------------------------------------------------------------------------------------------ sign in and create account
function afterSignIn(next) { S.mine = null; header(); location.hash = "#" + (next && next.startsWith("/") ? next : "/my"); }
function viewSignIn(view, next) {
  if (S.me) return afterSignIn(next);
  view.innerHTML = `<div class="wrap auth"><div class="box">
      <h1>Sign in</h1><p class="muted">Use your Octa account: the same one you use for MOOC Studio and the other Octa Insight apps.</p>
      <div id="m"></div>
      <form id="f" novalidate>
        <label class="field">Email or username<input name="login" autocomplete="username" required></label>
        <label class="field">Password<input name="pw" type="password" autocomplete="current-password" required></label>
        <button class="btn big block" type="submit">Sign in</button>
      </form>
      <p class="small" style="margin:18px 0 0">New here? <a href="#/join${next ? "?next=" + encodeURIComponent(next) : ""}">Create a free account</a></p>
      <p class="small muted" style="margin:6px 0 0">Forgot your password? <a href="${CFG.studio}" target="_blank" rel="noopener">Reset it on the Octa sign-in page</a> (choose "Forgot username or password").</p>
    </div></div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const f = e.target, b = $("button", f);
    if (!f.login.value.trim() || !f.pw.value) return ($("#m").innerHTML = `<div class="msg bad">Enter your email or username and your password.</div>`);
    b.disabled = true;
    try {
      const r = await api("octa_user_login", { p_login: f.login.value.trim(), p_password: f.pw.value, p_app: CFG.app });
      if (!r.ok) throw new Error(r.error || "Wrong email/username or password.");
      S.token = r.token; S.me = r.user; store.set(TOKEN_KEY, r.token);
      toast(`Welcome back, ${S.me.first_name || S.me.username}.`); afterSignIn(next);
    } catch (err) { $("#m").innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; b.disabled = false; }
  };
  $("input", view).focus();
}
function viewJoin(view, next) {
  if (S.me) return afterSignIn(next);
  view.innerHTML = `<div class="wrap auth" style="max-width:560px"><div class="box">
      <h1>Create your free account</h1><p class="muted">One Octa account opens every course on the MOOC. You can start learning straight away.</p>
      <div id="m"></div>
      <form id="f" novalidate>
        <div class="two"><label class="field">First name<input name="first" autocomplete="given-name" required></label>
          <label class="field">Family name<input name="last" autocomplete="family-name" required></label></div>
        <label class="field">Email<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">Username<span class="hint">3 to 40 letters, numbers, dots, dashes or underscores. You can sign in with it or with your email.</span>
          <input name="user" autocomplete="username" required></label>
        <label class="field">Password<span class="hint">At least 8 characters.</span><input name="pw" type="password" autocomplete="new-password" required></label>
        <label class="field">University or organisation<span class="hint">Optional</span><input name="aff" autocomplete="organization"></label>
        <button class="btn big block" type="submit">Create account</button>
      </form>
      <p class="small" style="margin:18px 0 0">Already have an Octa account? <a href="#/signin${next ? "?next=" + encodeURIComponent(next) : ""}">Sign in</a></p>
      <p class="small muted" style="margin:6px 0 0">Want to teach? Create your account, then ask for a teacher role in <a href="${CFG.studio}" target="_blank" rel="noopener">MOOC Studio</a>.</p>
    </div></div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const f = e.target, b = $("button", f), m = $("#m");
    const v = { first: f.first.value.trim(), last: f.last.value.trim(), email: f.email.value.trim(), user: f.user.value.trim(), pw: f.pw.value };
    const missing = [!v.first && "first name", !v.last && "family name", !v.email && "email", !v.user && "username", !v.pw && "password"].filter(Boolean);
    if (missing.length) return (m.innerHTML = `<div class="msg bad">Please fill in your ${missing.join(", ")}.</div>`);
    if (v.pw.length < 8) return (m.innerHTML = `<div class="msg bad">Your password needs at least 8 characters.</div>`);
    b.disabled = true;
    try {
      const r = await api("octa_user_register", { p: { email: v.email, username: v.user, password: v.pw, first_name: v.first, last_name: v.last,
        affiliation: f.aff.value.trim(), app: CFG.app, family: "education", profile: {} } });
      if (!r.ok) throw new Error(r.error || "The account could not be created.");
      S.token = r.token; S.me = r.user; store.set(TOKEN_KEY, r.token);
      await api("mooc_join", { p_token: S.token, p_kind: "student" }).catch(() => null);
      toast(`Welcome, ${v.first}. Your account is ready.`); afterSignIn(next || "/");
    } catch (err) { m.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; b.disabled = false; }
  };
  $("input", view).focus();
}

  await loadSession();
  route();
})();
