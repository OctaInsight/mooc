<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudEARTHi MOOC Profile</title>
<meta name="description" content="A learner's public page on the CloudEARTHi MOOC: badges, certificates and course progress.">
<style>
:root{--blue:#2a78d6;--blue-soft:#e8f1fc;--side:#f4f3ef;--line:#e4e3df;--text:#0b0b0b;--muted:#6b6a66;--ok:#1d6b3a;--ok-soft:#e7f5ec}
*{box-sizing:border-box}
body{margin:0;background:var(--side);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
header .brand{font-weight:700} header .brand span{color:var(--blue)}
main{max-width:980px;margin:0 auto;padding:26px 16px 48px}
.hero{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#5c9ee8,#1d5fae);color:#fff;display:grid;place-items:center;font-size:1.9rem;font-weight:700;flex:none}
h1{margin:0;font-size:1.5rem}
h2{font-size:1.05rem;margin:26px 0 10px}
.muted{color:var(--muted)}
.stats{display:flex;gap:22px;margin-top:6px;font-size:.92rem}
.stats b{font-size:1.15rem}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.award{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.award:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,30,50,.08)}
.award .em{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;border:4px solid #c9a646;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue);display:grid;place-items:center;font-size:2.3rem;background:var(--blue-soft);overflow:hidden}
.award .em img{width:100%;height:100%;object-fit:cover}
.award .t{font-weight:700;line-height:1.3}
.pill{display:inline-block;font-size:.72rem;border-radius:9px;padding:1px 8px;margin-top:6px;background:var(--ok-soft);color:var(--ok)}
.course{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.bar{height:8px;background:#e4e2db;border-radius:6px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--blue)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header><div class="brand">🎓 CloudEARTHi <span>MOOC</span></div></header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const DB_URL = "https://uxqeukvmnfvpgsxktgvo.supabase.co";
const DB_KEY = "sb_publishable_oFEaDte2Hy-gGsqpa9kWeQ_HuMm6dou";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const user = new URLSearchParams(location.search).get("u") || "";
(async () => {
  const main = document.getElementById("main");
  let p;
  try {
    const r = await fetch(`${DB_URL}/rest/v1/rpc/mooc_profile`, { method: "POST", body: JSON.stringify({ p_username: user }),
      headers: { apikey: DB_KEY, Authorization: `Bearer ${DB_KEY}`, "Content-Type": "application/json" } });
    p = await r.json();
  } catch (e) { main.innerHTML = `<div class="empty">The profile could not be loaded. Please try again.</div>`; return; }
  if (!p || !p.ok) { main.innerHTML = `<div class="empty">There is no public MOOC profile for “${esc(user)}”.</div>`; return; }
  const u = p.user, name = [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username;
  document.title = `${name} · CloudEARTHi MOOC`;
  const certs = p.awards.filter(a => a.kind === "certificate").length, badges = p.awards.length - certs;
  const since = new Date(u.since).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const award = a => `<a class="award" href="award.html?id=${a.id}">
      <div class="em">${a.image_url ? `<img src="${esc(a.image_url)}" alt="">` : (a.kind === "certificate" ? "📜" : "🏅")}</div>
      <div class="t">${esc(a.title)}</div>
      <div class="muted" style="font-size:.85rem">${esc(a.course)}</div>
      <span class="pill">${a.kind === "certificate" ? "Certificate" : "Badge"} · ${new Date(a.issued_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</span></a>`;
  main.innerHTML = `
    <div class="hero"><div class="avatar">${esc(name.trim()[0] || "?").toUpperCase()}</div>
      <div><h1>${esc(name)}</h1>
        <div class="muted">${[u.headline, u.affiliation].filter(Boolean).map(esc).join(" · ") || "Learner on the CloudEARTHi MOOC"} · since ${since}</div>
        <div class="stats"><span><b>${certs}</b> certificate${certs === 1 ? "" : "s"}</span><span><b>${badges}</b> badge${badges === 1 ? "" : "s"}</span>
          <span><b>${p.courses.length}</b> course${p.courses.length === 1 ? "" : "s"}</span></div></div></div>
    <h2>Certificates and badges</h2>
    ${p.awards.length ? `<div class="awards">${p.awards.map(award).join("")}</div>` : `<div class="empty">No awards yet.</div>`}
    <h2>Courses</h2>
    ${p.courses.length ? p.courses.map(c => { const pct = c.steps ? Math.round(100 * c.done / c.steps) : 0;
      return `<div class="course"><b>${esc(c.title)}</b><div class="bar"><i style="width:${pct}%"></i></div>
              <span class="muted" style="font-size:.85rem">${pct}% done</span></div>`; }).join("") : `<div class="empty">No courses yet.</div>`}`;
})();
</script>
</body>
</html>
